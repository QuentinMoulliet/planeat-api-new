doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MariaDB commits implicitly on every DDL statement (CREATE/ALTER TABLE):
    # wrapping migrations in a transaction is useless and triggers a deprecation notice
    transactional: false
